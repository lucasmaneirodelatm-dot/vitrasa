<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barrios de Vigo y Paradas Cercanas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
            color: #333;
        }
        h1 {
            color: #2c5f2d;
            text-align: center;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .barrio {
            padding: 10px;
            margin: 10px 0;
            background: #e8f5e9;
            border-left: 4px solid #2c5f2d;
            border-radius: 5px;
        }
        .parada {
            padding: 10px;
            margin: 10px 0;
            background: #e3f2fd;
            border-left: 4px solid #0d47a1;
            border-radius: 5px;
        }
        button {
            background: #2c5f2d;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #1b4d1f;
        }
        button:disabled {
            background: #cccccc;
            cursor: not-allowed;
        }
        #loading {
            display: none;
            text-align: center;
            margin: 20px 0;
        }
        #results {
            margin-top: 20px;
        }
        .error {
            color: red;
            text-align: center;
        }
        #barrioSelect {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            height: 300px;
        }
        .info {
            background: #fff3cd;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .success {
            background: #d4edda;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            color: #155724;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Barrios de Vigo y Paradas de Transporte Cercanas</h1>

        <div id="infoMessage" class="info">
            <p><strong>Nota:</strong> Los barrios se cargan automáticamente desde <a href="https://overpass-turbo.eu/" target="_blank">Overpass Turbo</a>. Si no aparecen barrios, se usará una lista predefinida.</p>
        </div>

        <div id="successMessage" class="success" style="display: none;">
            <p>✅ Barrios cargados correctamente. Selecciona uno y haz clic en "Buscar Parada Cercana".</p>
        </div>

        <div>
            <label for="barrioSelect">Barrio:</label>
            <select id="barrioSelect" size="10">
                <option value="">-- Cargando barrios de Vigo... --</option>
            </select>
            <button id="buscarButton" onclick="buscarParada()" disabled>Buscar Parada Cercana</button>
        </div>

        <div id="loading">
            <p>Cargando paradas de transporte...</p>
        </div>

        <div id="results"></div>
        <div id="error" class="error"></div>
    </div>

    <script>
        let paradasData = null;
        let barriosData = [];
        let barriosCargados = false;

        // Consulta mejorada a Overpass Turbo para obtener barrios y zonas de Vigo
        function cargarBarrios() {
            const overpassQuery = `[out:json];
            (
              node["name"~"^[A-Za-záéíóúüñÁÉÍÓÚÜÑ ]+$"]["place"="neighbourhood"](42.1, -8.8, 42.4, -8.6);
              node["name"~"^[A-Za-záéíóúüñÁÉÍÓÚÜÑ ]+$"]["place"="suburb"](42.1, -8.8, 42.4, -8.6);
              node["name"~"^[A-Za-záéíóúüñÁÉÍÓÚÜÑ ]+$"]["place"="quarter"](42.1, -8.8, 42.4, -8.6);
              way["name"~"^[A-Za-záéíóúüñÁÉÍÓÚÜÑ ]+$"]["place"="neighbourhood"](42.1, -8.8, 42.4, -8.6);
              way["name"~"^[A-Za-záéíóúüñÁÉÍÓÚÜÑ ]+$"]["place"="suburb"](42.1, -8.8, 42.4, -8.6);
              way["name"~"^[A-Za-záéíóúüñÁÉÍÓÚÜÑ ]+$"]["place"="quarter"](42.1, -8.8, 42.4, -8.6);
            );
            out body;
            >;
            out skel qt;`;

            fetch('https://overpass-api.de/api/interpreter', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: `data=${encodeURIComponent(overpassQuery)}`
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Error al cargar los barrios de Vigo desde Overpass Turbo.');
                }
                return response.json();
            })
            .then(data => {
                // Procesar los datos para extraer barrios con coordenadas
                const elementos = data.elements;
                barriosData = elementos
                    .filter(el => el.tags && el.tags.name)
                    .map(el => {
                        if (el.type === 'node') {
                            return {
                                name: el.tags.name,
                                lat: el.lat,
                                lon: el.lon
                            };
                        } else if (el.type === 'way' && el.nodes) {
                            // Calcular centroide para ways
                            const nodes = elementos.filter(n => el.nodes.includes(n.id));
                            const lats = nodes.map(n => n.lat).filter(l => l !== undefined);
                            const lons = nodes.map(n => n.lon).filter(l => l !== undefined);
                            if (lats.length > 0 && lons.length > 0) {
                                return {
                                    name: el.tags.name,
                                    lat: lats.reduce((a, b) => a + b, 0) / lats.length,
                                    lon: lons.reduce((a, b) => a + b, 0) / lons.length
                                };
                            }
                        }
                        return null;
                    })
                    .filter(el => el !== null && el.lat && el.lon);

                // Eliminar duplicados por nombre
                const barriosUnicos = [];
                const nombresVistos = new Set();
                barriosData.forEach(barrio => {
                    if (!nombresVistos.has(barrio.name)) {
                        nombresVistos.add(barrio.name);
                        barriosUnicos.push(barrio);
                    }
                });

                barriosData = barriosUnicos;

                // Rellenar el select con los barrios
                const select = document.getElementById('barrioSelect');
                select.innerHTML = '<option value="">-- Selecciona un barrio --</option>';
                barriosData.forEach(barrio => {
                    const option = document.createElement('option');
                    option.value = `${barrio.lat},${barrio.lon},${barrio.name}`;
                    option.textContent = barrio.name;
                    select.appendChild(option);
                });

                document.getElementById('successMessage').style.display = 'block';
                document.getElementById('buscarButton').disabled = false;
                barriosCargados = true;
            })
            .catch(error => {
                console.error('Error al cargar barrios desde Overpass:', error);
                usarListaPredefinida();
            });
        }

        // Usar una lista predefinida de barrios si falla la carga desde Overpass
        function usarListaPredefinida() {
            const select = document.getElementById('barrioSelect');
            select.innerHTML = `
                <option value="">-- Selecciona un barrio --</option>
                <option value="42.2328,-8.7219,Casco Vello">Casco Vello</option>
                <option value="42.2350,-8.7200,Bouzas">Bouzas</option>
                <option value="42.2200,-8.7000,Teis">Teis</option>
                <option value="42.2300,-8.6900,Coia">Coia</option>
                <option value="42.2100,-8.7100,Castrelos">Castrelos</option>
                <option value="42.2000,-8.6800,Coruxo">Coruxo</option>
                <option value="42.2400,-8.7300,Candeán">Candeán</option>
                <option value="42.2150,-8.6700,Zamáns">Zamáns</option>
                <option value="42.2250,-8.7250,O Calvario">O Calvario</option>
                <option value="42.2370,-8.7150,O Castro">O Castro</option>
                <option value="42.2300,-8.7300,Canido">Canido</option>
                <option value="42.2100,-8.7350,Freixeiro">Freixeiro</option>
                <option value="42.2050,-8.7050,Alcabre">Alcabre</option>
                <option value="42.2200,-8.6600,Saiáns">Saiáns</option>
                <option value="42.2500,-8.7500,Nigrán">Nigrán (zona cercana)</option>
                <option value="42.2450,-8.7100,Berbés">Berbés</option>
                <option value="42.2380,-8.7050,Areal">Areal</option>
                <option value="42.2280,-8.6950,Príncipe">Príncipe/Ensanche</option>
                <option value="42.2220,-8.7150,Monte do Castro">Monte do Castro</option>
            `;
            document.getElementById('error').textContent = 'No se pudieron cargar todos los barrios desde Overpass Turbo. Usando lista predefinida.';
            document.getElementById('buscarButton').disabled = false;
            barriosCargados = true;
        }

        // Cargar el JSON de paradas al iniciar la página
        fetch('https://datos.vigo.org/data/transporte/paradas.json')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Error al cargar las paradas de transporte.');
                }
                return response.json();
            })
            .then(data => {
                paradasData = data;
            })
            .catch(error => {
                document.getElementById('error').textContent = 'No se pudieron cargar los datos de paradas. Inténtalo más tarde.';
                console.error('Error al cargar paradas:', error);
            });

        // Iniciar la carga de barrios al cargar la página
        window.onload = function() {
            cargarBarrios();
        };

        function buscarParada() {
            const select = document.getElementById('barrioSelect');
            const barrioSeleccionado = select.value;
            const resultsDiv = document.getElementById('results');
            const errorDiv = document.getElementById('error');

            if (!barrioSeleccionado) {
                errorDiv.textContent = 'Por favor, selecciona un barrio.';
                resultsDiv.innerHTML = '';
                return;
            }

            errorDiv.textContent = '';
            resultsDiv.innerHTML = '';
            document.getElementById('loading').style.display = 'block';

            setTimeout(() => {
                if (!paradasData) {
                    errorDiv.textContent = 'Los datos de paradas aún no se han cargado. Inténtalo de nuevo en unos segundos.';
                    document.getElementById('loading').style.display = 'none';
                    return;
                }

                const [latBarrio, lonBarrio, nombreBarrio] = barrioSeleccionado.split(',');

                let paradaMasCercana = null;
                let distanciaMinima = Infinity;

                paradasData.forEach(parada => {
                    const latParada = parseFloat(parada.lat);
                    const lonParada = parseFloat(parada.lon);

                    // Calcular distancia en metros (usando Haversine)
                    const distancia = calcularDistancia(
                        parseFloat(latBarrio),
                        parseFloat(lonBarrio),
                        latParada,
                        lonParada
                    );

                    if (distancia < distanciaMinima) {
                        distanciaMinima = distancia;
                        paradaMasCercana = parada;
                    }
                });

                document.getElementById('loading').style.display = 'none';

                if (paradaMasCercana) {
                    // Usar nombre de la parada o identificador/address si no tiene nombre
                    let nombreParada = paradaMasCercana.name || `Parada ${paradaMasCercana.id}`;
                    if (paradaMasCercana.address) {
                        nombreParada = paradaMasCercana.address;
                    }

                    resultsDiv.innerHTML = `
                        <div class="barrio">
                            <h3>Barrio seleccionado:</h3>
                            <p><strong>${nombreBarrio}</strong> (Lat: ${latBarrio}, Lon: ${lonBarrio})</p>
                        </div>
                        <div class="parada">
                            <h3>Parada de transporte más cercana:</h3>
                            <p><strong>${nombreParada}</strong></p>
                            <p>Distancia: ${distanciaMinima.toFixed(0)} metros</p>
                            <p>Coordenadas: (Lat: ${paradaMasCercana.lat}, Lon: ${paradaMasCercana.lon})</p>
                        </div>
                    `;
                } else {
                    errorDiv.textContent = 'No se encontró ninguna parada cercana.';
                }
            }, 500);
        }

        // Función para calcular la distancia entre dos puntos (Haversine)
        function calcularDistancia(lat1, lon1, lat2, lon2) {
            const R = 6371000; // Radio de la Tierra en metros
            const φ1 = lat1 * Math.PI / 180;
            const φ2 = lat2 * Math.PI / 180;
            const Δφ = (lat2 - lat1) * Math.PI / 180;
            const Δλ = (lon2 - lon1) * Math.PI / 180;

            const a = Math.sin(Δφ / 2) * Math.sin(Δφ / 2) +
                      Math.cos(φ1) * Math.cos(φ2) *
                      Math.sin(Δλ / 2) * Math.sin(Δλ / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

            return R * c;
        }
    </script>
</body>
</html>
